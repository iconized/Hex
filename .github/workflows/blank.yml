name: Bump Kyro Release Download Counts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (blank = auto-detect latest release)"
        required: false
        default: ""

# TARGET_TAG is optional: leave blank to always track the latest release.
env:
  TARGET_REPO: eshanized/Kyro
  TARGET_TAG: ""

permissions:
  contents: read

concurrency:
  group: bump-kyro-downloads
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      assets: ${{ steps.latest.outputs.assets }}
    steps:
      - name: Resolve target release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OVERRIDE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${TARGET_TAG:-}"
          [ -n "$tag" ] || tag="${OVERRIDE_TAG:-}"

          if [ -n "$tag" ]; then
            echo "Using pinned tag: $tag"
            release=$(gh api "repos/${TARGET_REPO}/releases/tags/${tag}")
          else
            echo "Auto-detecting latest release..."
            # /releases/latest 404s when every release is a prerelease, so fall
            # back to the list endpoint and skip drafts.
            release=$(gh api "repos/${TARGET_REPO}/releases/latest" 2>/dev/null) || {
              echo "releases/latest unavailable, falling back to release list" >&2
              release=$(gh api "repos/${TARGET_REPO}/releases?per_page=30" \
                --jq '[.[] | select(.draft | not)][0]')
            }
          fi

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "::error::Could not resolve any release for ${TARGET_REPO}"
            exit 1
          fi

          tag=$(jq -r '.tag_name // empty' <<<"$release")
          assets=$(jq -c '[.assets[].name]' <<<"$release")

          echo "Resolved tag : $tag"
          echo "Assets       : $assets"

          if [ -z "$tag" ]; then
            echo "::error::Resolved release has no tag_name"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

  bump:
    name: bump-${{ matrix.parallel }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        parallel: [1, 2, 3, 4, 5]
    steps:
      - name: Hit every release asset (redirect only)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          ASSETS: ${{ needs.resolve.outputs.assets }}
        run: |
          set -euo pipefail

          if [ -z "${TAG:-}" ] || [ -z "${ASSETS:-}" ]; then
            echo "::error::resolve produced no tag/assets"
            exit 1
          fi

          base="https://github.com/${TARGET_REPO}/releases/download/${TAG}"

          mapfile -t assets < <(jq -r '.[]' <<<"$ASSETS")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No assets for ${TARGET_REPO}@${TAG}"
            exit 1
          fi

          sleep $((RANDOM % 10))

          fail=0
          for asset in "${assets[@]}"; do
            url="${base}/$(jq -rn --arg n "$asset" '$n|@uri')"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            echo "HTTP $code <- $asset"
            [ "$code" = "302" ] || fail=1
            sleep 1
          done

          exit $fail

  report:
    name: report
    needs: [resolve, bump]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Current download counts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          [ -n "${TAG:-}" ] || { echo "Tag unresolved; skipping report" >&2; exit 0; }

          {
            echo "## Download counts for \`${TARGET_REPO}\` @ \`${TAG}\`"
            echo ""
            echo "> Counters update in batches with a ~10 min lag, so the numbers below"
            echo "> reflect the *previous* window, not the hits this run just fired."
            echo ""
            echo "| Asset | Downloads |"
            echo "| :-- | --: |"
          } >> "$GITHUB_STEP_SUMMARY"

          gh api "repos/${TARGET_REPO}/releases/tags/${TAG}" \
            --jq '.assets | sort_by(-.download_count)[] | "| `\(.name)` | \(.download_count) |"' \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${TARGET_REPO}/releases/tags/${TAG}" \
            --jq '"**Total: \(.assets | map(.download_count) | add) downloads across \(.assets | length) assets**"' \
            >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    name: keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit a daily heartbeat if needed
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          if [ -f .heartbeat ] && [ "$(cat .heartbeat)" = "$today" ]; then
            echo "Already heartbeated today"
            exit 0
          fi
          echo "$today" > .heartbeat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: heartbeat ${today}"
          git push
